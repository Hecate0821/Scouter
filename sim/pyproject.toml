[project]
name = "scouter-sim"
version = "0.1.0"
description = "Runs Scouter's training layouts with real PyTorch parallelism (FSDP2, DTensor TP, all-to-all EP) on CPU gloo processes and records every collective as a JSON trace."
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "torch>=2.6",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
